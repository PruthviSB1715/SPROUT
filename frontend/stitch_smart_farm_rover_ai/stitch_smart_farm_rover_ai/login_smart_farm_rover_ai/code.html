<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Farm Rover AI - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed-variant": "#7f2448",
                        "surface-variant": "#e0e4da",
                        "primary-fixed-dim": "#88d982",
                        "on-primary-container": "#cbffc2",
                        "error-container": "#ffdad6",

                        "on-surface": "#181d17",
                        "secondary-fixed": "#ffdbcf",
                        "error": "#ba1a1a",
                        "tertiary": "#923357",
                        "inverse-surface": "#2d322b",
                        "tertiary-container": "#b14b6f",
                        "on-secondary-container": "#795548",
                        "surface-bright": "#f7fbf0",
                        "on-background": "#181d17",
                        "on-primary-fixed-variant": "#005312",
                        "on-primary-fixed": "#002204",
                        "on-surface-variant": "#40493d",
                        "surface-container-high": "#e5eadf",
                        "primary-fixed": "#a3f69c",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#ebbcac",
                        "surface": "#f7fbf0",
                        "tertiary-fixed-dim": "#ffb1c7",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d7dbd2",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f1f5eb",
                        "on-error-container": "#93000a",
                        "secondary-container": "#fdcdbc",
                        "tertiary-fixed": "#ffd9e2",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eef2e8",
                        "on-secondary-fixed-variant": "#603f33",
                        "background": "#f7fbf0",
                        "secondary": "#7a5649",
                        "primary": "#0d631b",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#bfcaba",
                        "on-tertiary-container": "#ffedf0",
                        "on-secondary-fixed": "#2e150b",
                        "outline": "#707a6c",
                        "surface-container-highest": "#e0e4da",
                        "on-tertiary-fixed": "#3f001c",
                        "primary-container": "#2e7d32",
                        "surface-container": "#ebefe5",
                        "surface-tint": "#1b6d24"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "xl": "32px",
                        "gutter": "16px",
                        "sm": "8px",
                        "container-margin": "24px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],

                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],

                }
            }
        }

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter relative overflow-hidden">
<!-- Subtle Background Layer -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-30" data-alt="A serene, high-tech agricultural landscape at dawn. The scene is clean, modern, and light, featuring precise rows of crops bathed in soft, diffused morning light. Subtle, minimalist data overlays and clean lines subtly suggest advanced AI farming techniques. The mood is calm, professional, and optimistic, adhering to a sophisticated light-mode aesthetic with dominant whites, soft grays, and natural greens." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCUzozKVz5zy0OpCbs1YOIMw6Odn1mMozEetDoAmwsFXMY8ywWJjxYLLHuy0qolOF1NQLrKEe293koZlRX_Y4isoF9nEPr-woAf1uN4ykA-lLElP7ucCXAZK0cIEGc2yoMj64ajtb4RiSlggmy1_PnM1gxXswOTtx3kf7milh2rFxI7ofpb5ZqSj4ssy2lij71NMlJS2-InQN95hQvRLKE1U3Y3MMusIsnJtV0PCQHWRFq2ySmEwsVt')"></div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-br from-surface/90 via-surface/80 to-surface-container-highest/90"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0px_8px_24px_rgba(0,0,0,0.12)] p-container-margin md:p-xl flex flex-col gap-lg border border-surface-container-highest">
<!-- Header / Logo -->
<div class="flex flex-col items-center text-center gap-sm">
<div class="w-16 h-16 rounded-lg bg-surface-container flex items-center justify-center mb-sm shadow-sm border border-surface-variant">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="agriculture" data-weight="fill" style="font-variation-settings: 'FILL' 1;">agriculture</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface font-bold tracking-tight">Smart Farm Rover AI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Please select your role and sign in.</p>
</div>
<!-- Role Selection -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface uppercase text-center block w-full mb-xs">Select Role</label>
<div class="grid grid-cols-3 gap-xs p-1 bg-surface-container-low rounded-lg border border-surface-variant">
<!-- Farmer (Active) -->
<button class="flex flex-col items-center justify-center p-sm rounded-md bg-surface shadow-sm border border-primary/20 text-primary transition-all group">
<span class="material-symbols-outlined text-xl mb-1" data-icon="grass" data-weight="fill" style="font-variation-settings: 'FILL' 1;">grass</span>
<span class="font-label-md text-label-md text-center leading-tight">Farmer</span>
</button>
<!-- Agent (Inactive) -->
<button class="flex flex-col items-center justify-center p-sm rounded-md hover:bg-surface-variant text-on-surface-variant transition-colors group">
<span class="material-symbols-outlined text-xl mb-1 group-hover:text-on-surface" data-icon="support_agent">support_agent</span>
<span class="font-label-md text-label-md text-center leading-tight">Agri Agent</span>
</button>
<!-- Adhikari (Inactive) -->
<button class="flex flex-col items-center justify-center p-sm rounded-md hover:bg-surface-variant text-on-surface-variant transition-colors group">
<span class="material-symbols-outlined text-xl mb-1 group-hover:text-on-surface" data-icon="local_police">local_police</span>
<span class="font-label-md text-label-md text-center leading-tight">Adhikari</span>
</button>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Email/Mobile Field -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm font-bold text-on-surface" for="identifier">Email or Mobile Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="person">person</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors placeholder-on-surface-variant/50" id="identifier" name="identifier" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-body-sm text-body-sm font-bold text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-3 bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-sm" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2 mt-xs">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface transition-colors cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-body-md text-body-md font-bold py-3 px-4 rounded-lg shadow-[0px_2px_8px_rgba(0,0,0,0.05)] hover:shadow-[0px_4px_12px_rgba(0,0,0,0.1)] active:shadow-none transition-all flex items-center justify-center gap-2 mt-sm" type="submit">
                Sign In securely
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="text-center pt-sm border-t border-surface-variant">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New to Smart Farm Rover AI? 
                <a class="text-primary hover:text-primary-container font-bold transition-colors" href="#">Create an account</a>
</p>
</div>
</div>
</body></html>
